<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV Note">
<meta name="theme-color" content="#050507">
<title>TV Note</title>
<style>
:root {
  --bg: #050507; --text: #f5f5f7; --muted: rgba(235,235,245,.55);
  --glass: rgba(255,255,255,.07); --edge: rgba(255,255,255,.12); --hi: rgba(255,255,255,.22);
  --ease: cubic-bezier(.22,.8,.22,1); --spring: cubic-bezier(.3,1.4,.5,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; overscroll-behavior: none;
  font-family: -apple-system, "SF Pro Text", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; }

.aura { position: fixed; inset: -20%; z-index: -1; filter: blur(60px); opacity: .55; pointer-events: none;
  background:
    radial-gradient(35% 30% at 20% 15%, rgba(120, 90, 255, .55), transparent 70%),
    radial-gradient(30% 28% at 85% 30%, rgba(255, 90, 160, .35), transparent 70%),
    radial-gradient(40% 35% at 60% 95%, rgba(40, 170, 255, .35), transparent 70%);
  animation: drift 18s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate3d(4%, -3%, 0) rotate(8deg) scale(1.08); } }

body { display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); }

header { width: 100%; max-width: 520px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 2px 2px 4px; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -.025em; white-space: nowrap; }
.hright { display: flex; align-items: center; gap: 10px; min-width: 0; }
#status { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; }
#status i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #8e8e93; transition: background 300ms; }
#status.live { color: var(--text); } #status.live i { background: #30d158; box-shadow: 0 0 10px #30d158; }
#status.dirty i { background: #ffd60a; }
#status.busy i { background: #ffd60a; animation: pulse 900ms ease-in-out infinite; }
#status.err { color: #ff6961; } #status.err i { background: #ff453a; }
@keyframes pulse { 50% { opacity: .3; } }
#send { flex: none; height: 40px; padding: 0 18px 0 14px; border: 0; border-radius: 999px; background: var(--text); color: #000;
  font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 7px; box-shadow: 0 10px 30px -10px rgba(255,255,255,.35);
  transition: transform 160ms var(--ease), opacity 200ms; }
#send svg { width: 17px; height: 17px; }
#send:active { transform: scale(.94); }
#send:disabled { opacity: .4; }

/* pad: same 4:5 shape as the card on the TV */
#wrap { flex: 1; width: 100%; display: grid; place-items: center; min-height: 0; }
#pad { position: relative; aspect-ratio: 4 / 5; height: 100%; max-width: 100%; max-height: 100%;
  border-radius: 32px; overflow: hidden; touch-action: none;
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.09) 1px, transparent 1.4px) 0 0 / 22px 22px,
    linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  box-shadow: inset 0 0 0 .5px var(--edge), inset 0 1px 0 var(--hi), 0 30px 80px -30px rgba(0,0,0,.9);
  -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
#empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none;
  color: var(--muted); font-size: 15px; line-height: 1.5; transition: opacity 400ms var(--ease); }
#empty b { display: block; font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
#flash { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.7), inset 0 0 60px rgba(255,255,255,.12); }
#flash.go { animation: flash 900ms var(--ease); }
@keyframes flash { 15% { opacity: 1; } }
#del { position: absolute; top: 12px; right: 12px; height: 36px; padding: 0 14px; border: 0; border-radius: 999px;
  background: rgba(255,69,58,.9); color: #fff; font-size: 14px; font-weight: 600; display: none; align-items: center; gap: 6px;
  box-shadow: 0 8px 20px -6px rgba(0,0,0,.6); }
#del.show { display: flex; }
#del svg { width: 15px; height: 15px; }

/* dock */
.dock { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 9px; padding: 10px;
  border-radius: 26px; background: var(--glass);
  box-shadow: inset 0 0 0 .5px var(--edge), inset 0 1px 0 var(--hi), 0 20px 50px -20px rgba(0,0,0,.8);
  -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6); }
.line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.seg { display: flex; padding: 3px; border-radius: 999px; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 .5px var(--edge);
  overflow-x: auto; scrollbar-width: none; min-width: 0; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; height: 32px; padding: 0 11px; border: 0; border-radius: 999px; background: transparent; color: var(--muted);
  font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: background 200ms, color 200ms; }
.seg button.on { background: rgba(255,255,255,.16); color: var(--text); box-shadow: inset 0 1px 0 var(--hi); }
.icons { display: flex; gap: 6px; flex: none; }
.ib { width: 36px; height: 36px; border: 0; border-radius: 50%; display: grid; place-items: center;
  background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 .5px var(--edge); transition: transform 160ms var(--ease), background 200ms; }
.ib svg { width: 18px; height: 18px; }
.ib:active { transform: scale(.9); }
.ib.warn { background: rgba(255,69,58,.85); }

.panel { display: none; flex-direction: column; gap: 9px; }
.panel.on { display: flex; }
.scroll { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px 6px; scroll-snap-type: x proximity; min-width: 0; }
.scroll::-webkit-scrollbar { display: none; }

/* shared colour + size row */
#paint { display: flex; align-items: center; gap: 8px; }
#paint.hide { display: none; }
#sizes { flex: none; display: flex; gap: 2px; align-items: center; padding-right: 4px; border-right: .5px solid var(--edge); }
#sizes button { width: 28px; height: 30px; border: 0; background: transparent; display: grid; place-items: center; }
#sizes button i { display: block; border-radius: 50%; background: var(--muted); }
#sizes button.on i { background: var(--text); box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
.dot { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; position: relative; scroll-snap-align: start;
  box-shadow: inset 0 0 0 .5px rgba(255,255,255,.25); }
.dot::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; box-shadow: 0 0 0 2px var(--text); opacity: 0; transform: scale(.8);
  transition: opacity 200ms, transform 260ms var(--spring); }
.dot.on::after { opacity: 1; transform: none; }
.dot.custom { background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
.dot.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }

/* shapes */
.shapes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.shapes button { height: 44px; border: 0; border-radius: 12px; background: rgba(255,255,255,.06); display: grid; place-items: center;
  box-shadow: inset 0 0 0 .5px var(--edge); color: var(--muted); transition: background 160ms, color 160ms; }
.shapes button svg { width: 22px; height: 22px; }
.shapes button.on { background: rgba(255,255,255,.18); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--text); }

/* stickers */
.stk { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; max-height: 120px; overflow-y: auto; scrollbar-width: none; }
.stk::-webkit-scrollbar { display: none; }
.stk button { aspect-ratio: 1; border: 0; border-radius: 12px; background: transparent; font-size: 25px; line-height: 1;
  transition: transform 160ms var(--ease), background 160ms; }
.stk button:active { transform: scale(.85); background: rgba(255,255,255,.1); }
.textbtn { height: 38px; border: 0; border-radius: 12px; background: rgba(255,255,255,.1); font-size: 15px; font-weight: 600;
  box-shadow: inset 0 0 0 .5px var(--edge); }
.hint { font-size: 12.5px; color: var(--muted); text-align: center; }

/* designs */
.des { flex: none; width: 64px; display: flex; flex-direction: column; gap: 6px; align-items: center; border: 0; background: transparent; scroll-snap-align: start; }
.des i { width: 56px; height: 70px; border-radius: 14px; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.25); transition: transform 260ms var(--spring); }
.des span { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.des.on i { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); transform: scale(1.04); }
.des.on span { color: var(--text); }

/* sheets */
.sheet { position: fixed; inset: 0; display: none; flex-direction: column; justify-content: center; gap: 14px; padding: 28px;
  background: rgba(5,5,7,.8); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); z-index: 5; }
.sheet.show { display: flex; }
.sheet h2 { font-size: 28px; letter-spacing: -.02em; }
.sheet p { color: var(--muted); font-size: 16px; line-height: 1.45; }
.sheet input { height: 52px; border-radius: 16px; border: 0; padding: 0 16px; background: var(--glass); color: var(--text); font: 17px inherit;
  box-shadow: inset 0 0 0 .5px var(--edge); -webkit-user-select: text; user-select: text; }
.sheet .row { display: flex; gap: 10px; }
.sheet .row button { flex: 1; height: 50px; border-radius: 16px; border: 0; font-weight: 600; font-size: 17px; }
.primary { background: var(--text); color: #000 !important; }
.secondary { background: var(--glass); box-shadow: inset 0 0 0 .5px var(--edge); }
.fonts { display: flex; gap: 8px; }
.fonts button { flex: 1; height: 44px; border: 0; border-radius: 12px; background: var(--glass); box-shadow: inset 0 0 0 .5px var(--edge); font-size: 17px; }
.fonts button.on { background: rgba(255,255,255,.18); box-shadow: inset 0 0 0 1.5px var(--text); }
</style>
</head>
<body>
<div class="aura"></div>
<header>
  <h1>TV Note</h1>
  <div class="hright">
    <div id="status"><i></i><span>Draw, then send</span></div>
    <button id="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>Send</button>
  </div>
</header>

<div id="wrap"><div id="pad"><canvas id="c"></canvas>
  <div id="empty"><div><b>Draw something</b>Add shapes, stickers and designs below.<br>Tap Send to put it on your TV.</div></div>
  <div id="flash"></div>
  <button id="del"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Remove</button>
</div></div>

<div class="dock">
  <div class="line">
    <div class="seg" id="tabs">
      <button data-t="draw" class="on">Draw</button>
      <button data-t="shapes">Shapes</button>
      <button data-t="stickers">Stickers</button>
      <button data-t="designs">Designs</button>
    </div>
    <div class="icons">
      <button class="ib" id="undo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="ib" id="clear" aria-label="Clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
    </div>
  </div>

  <div class="panel on" id="p-draw">
    <div class="seg" id="brushes">
      <button data-b="pen" class="on">Pen</button>
      <button data-b="marker">Marker</button>
      <button data-b="highlighter">Highlighter</button>
      <button data-b="glow">Glow</button>
      <button data-b="rainbow">Rainbow</button>
      <button data-b="calligraphy">Calligraphy</button>
      <button data-b="chalk">Chalk</button>
      <button data-b="dotted">Dotted</button>
      <button data-b="spray">Spray</button>
      <button data-b="eraser">Eraser</button>
    </div>
  </div>

  <div class="panel" id="p-shapes">
    <div class="shapes" id="shapes">
      <button data-s="line" class="on" aria-label="Line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 19 19 5"/></svg></button>
      <button data-s="arrow" aria-label="Arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M10 5h9v9"/></svg></button>
      <button data-s="rect" aria-label="Square"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="5" width="16" height="14" rx="3"/></svg></button>
      <button data-s="circle" aria-label="Circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/></svg></button>
      <button data-s="heart" aria-label="Heart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
      <button data-s="star" aria-label="Star"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/></svg></button>
    </div>
    <div class="seg" id="fill" style="align-self:flex-start">
      <button data-f="outline" class="on">Outline</button>
      <button data-f="filled">Filled</button>
    </div>
  </div>

  <div class="panel" id="p-stickers">
    <button class="textbtn" id="addText">Aa&nbsp;&nbsp;Add text</button>
    <div class="stk" id="stickers"></div>
    <div class="hint">Drag to move. Pinch with two fingers to resize and turn.</div>
  </div>

  <div class="panel" id="p-designs">
    <div class="scroll" id="designs"></div>
  </div>

  <div id="paint"><div id="sizes"></div><div class="scroll" id="colors"></div></div>
</div>

<div class="sheet" id="pair">
  <h2>Pair with your TV</h2>
  <p>Paste the pairing code for your TV. You only do this once on this phone.</p>
  <input id="code" placeholder="tvnote-…" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div class="row"><button class="primary" id="save">Pair</button></div>
</div>

<div class="sheet" id="textSheet">
  <h2>Add text</h2>
  <input id="textIn" maxlength="40" placeholder="Dinner at 7 ❤️" autocomplete="off">
  <div class="fonts" id="fonts">
    <button data-f="bold" class="on" style="font-weight:800">Bold</button>
    <button data-f="script" style="font-family:'Snell Roundhand','Segoe Script',cursive">Script</button>
    <button data-f="neon" style="font-weight:600;text-shadow:0 0 8px #ff6ad5">Neon</button>
    <button data-f="type" style="font-family:'American Typewriter','Courier New',monospace">Type</button>
  </div>
  <div class="row"><button class="secondary" id="textCancel">Cancel</button><button class="primary" id="textAdd">Add</button></div>
</div>

<script>
"use strict";
const RELAY = "https://ntfy.sh/";
const OUT_W = 720, OUT_H = 900;  // image the TV receives (4:5)

const COLORS = ["#ffffff", "#c7c7cc", "#1c1c1e", "#ff3b30", "#ff8a65", "#ff9500", "#ffd60a", "#fff3a0", "#a6e22e", "#34d399",
  "#00c7be", "#64d2ff", "#0a84ff", "#5e5ce6", "#a78bfa", "#bf5af2", "#ff6ad5", "#ff2d55", "#f4c2c2", "#c69c6d", "#8b5a2b"];
const STICKERS = ["❤️","💖","💕","✨","⭐","🌟","🔥","💯","😂","😍","🥰","😘","😎","🥳","😴","🤗","👋","👍","🙌","👏","🎉","🎊","🎁","🎂",
  "🍿","🎬","📺","🎮","🎵","🎧","🍕","🍔","🌮","🍣","☕","🍷","🍪","🍩","🌙","☀️","🌈","⛅","❄️","🌸","🌻","🍀","🌊","🏖️",
  "🐶","🐱","🐻","🦊","🐼","🦄","🦋","🐝","🏠","🚗","✈️","⚽","🏀","💤","💡","📌"];
const DESIGNS = [
  { id: "none",     name: "Glass",    css: "linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04))" },
  { id: "midnight", name: "Midnight", css: "linear-gradient(160deg,#1b2a6b,#070b1f)", stops: [["#1b2a6b", 0], ["#070b1f", 1]] },
  { id: "sunset",   name: "Sunset",   css: "linear-gradient(170deg,#ff9a5a,#ff4f81 55%,#6a2ca8)", stops: [["#ff9a5a", 0], ["#ff4f81", .55], ["#6a2ca8", 1]] },
  { id: "aurora",   name: "Aurora",   css: "linear-gradient(160deg,#0b3d3a,#1fa37a 45%,#3b1f6b)", stops: [["#0b3d3a", 0], ["#1fa37a", .45], ["#3b1f6b", 1]] },
  { id: "ocean",    name: "Ocean",    css: "linear-gradient(180deg,#56ccf2,#2f80ed 55%,#0b2a5b)", stops: [["#56ccf2", 0], ["#2f80ed", .55], ["#0b2a5b", 1]] },
  { id: "peach",    name: "Peach",    css: "linear-gradient(160deg,#ffe1c6,#ffb199)", stops: [["#ffe1c6", 0], ["#ffb199", 1]] },
  { id: "paper",    name: "Paper",    css: "#f6f0e1", solid: "#f6f0e1", lines: "rgba(80,110,170,.25)" },
  { id: "chalk",    name: "Chalk",    css: "#1f3a2e", solid: "#1f3a2e", noise: true },
  { id: "hearts",   name: "Love",     css: "linear-gradient(160deg,#ff8fb1,#ff4f81)", stops: [["#ff8fb1", 0], ["#ff4f81", 1]], pattern: "❤" },
  { id: "stars",    name: "Stars",    css: "linear-gradient(180deg,#141a3a,#05060f)", stops: [["#141a3a", 0], ["#05060f", 1]], stars: true },
  { id: "confetti", name: "Party",    css: "linear-gradient(160deg,#2b1055,#7597de)", stops: [["#2b1055", 0], ["#7597de", 1]], confetti: true }
];
const WIDTH = { pen: .011, marker: .03, highlighter: .06, glow: .009, rainbow: .016, calligraphy: .028, chalk: .022, dotted: .014, spray: .05, eraser: .06, shape: .012 };
const SIZES = [.55, 1, 1.8];
const FONTS = {
  bold:   { css: '800 1em -apple-system, "SF Pro Display", Inter, sans-serif' },
  script: { css: '400 1em "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive' },
  neon:   { css: '600 1em -apple-system, "SF Pro Rounded", Inter, sans-serif', glow: true },
  type:   { css: '400 1em "American Typewriter", "Courier New", monospace' }
};

// ---------- pairing code: from the link (#code) or typed once; kept on this phone only ----------
const okCode = c => /^[\w-]{12,64}$/.test(c || "");
function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
let code = decodeURIComponent(location.hash.slice(1)) || load("code") || "";
if (location.hash) { if (okCode(code)) save("code", code); history.replaceState(null, "", location.pathname); }
const $ = id => document.getElementById(id);
const pairEl = $("pair");
if (!okCode(code)) pairEl.classList.add("show");
$("save").onclick = () => {
  const v = $("code").value.trim();
  if (!okCode(v)) return;
  code = v; save("code", v); pairEl.classList.remove("show");
};

// ---------- state ----------
// Layers, bottom to top: design, ink (strokes + shapes; the eraser only removes ink), stickers + text.
// Positions are 0..1 of the pad, so the TV copy is drawn sharp at its own size.
let items = [], bg = "none", selected = null;
let color = COLORS[0], brush = "pen", sizeMul = 1, tab = "draw", font = "bold", shape = "line", fillMode = "outline";
const undoStack = [];
const snap = () => JSON.stringify({ items, bg });
function remember() { undoStack.push(snap()); if (undoStack.length > 60) undoStack.shift(); }
function restore(s) { const o = JSON.parse(s); items = o.items; bg = o.bg; selected = null; }
const isInk = o => o.t === "s" || o.t === "h";

// ---------- UI ----------
function choose(group, el) { group.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); }
$("tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
  tab = b.dataset.t; choose($("tabs"), b);
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-" + tab));
  $("paint").classList.toggle("hide", tab === "designs");
  if (tab !== "stickers") { selected = null; redraw(); }
});
$("brushes").querySelectorAll("button").forEach(b => b.onclick = () => { brush = b.dataset.b; choose($("brushes"), b); });
$("shapes").querySelectorAll("button").forEach(b => b.onclick = () => { shape = b.dataset.s; choose($("shapes"), b); });
$("fill").querySelectorAll("button").forEach(b => b.onclick = () => { fillMode = b.dataset.f; choose($("fill"), b); });
SIZES.forEach((m, i) => {

// ---------- Send: only when you tap it ----------
const statusEl = $("status"), statusText = statusEl.querySelector("span"), flash = $("flash"), sendBtn = $("send");
function setStatus(t, cls) { statusText.textContent = t; statusEl.className = cls || ""; }
function sent() { flash.classList.remove("go"); void flash.offsetWidth; flash.classList.add("go"); if (navigator.vibrate) navigator.vibrate(10); }
sendBtn.onclick = async () => {
  if (!okCode(code)) return pairEl.classList.add("show");
  sendBtn.disabled = true; setStatus("Sending", "busy");
  try {
    let r;
    if (!items.length && bg === "none") r = await fetch(RELAY + encodeURIComponent(code), { method: "POST", body: "clear" });
    else {
      const out = canvasOf(OUT_W, OUT_H); renderAll(out.getContext("2d"), OUT_W, OUT_H);
      const blob = await new Promise(ok => out.toBlob(ok, "image/png"));
      r = await fetch(RELAY + encodeURIComponent(code) + "?filename=note.png", { method: "PUT", body: blob });
    }
    if (!r.ok) throw new Error(r.status);
    setStatus(items.length || bg !== "none" ? "On your TV" : "Removed from TV", "live"); sent();
  } catch (e) { setStatus("Not sent. Try again.", "err"); }
  sendBtn.disabled = false;
};

size();
if (items.length || bg !== "none") setStatus("Draft not sent yet", "dirty");
</script>
</body>
</html>
